  font-size:13px;
  font-weight:700;
  letter-spacing:.05em;
  text-decoration:none;
  cursor:pointer;
  transition:all .2s;

  max-width:280px;

.btn-primary{background:var(--gold);color:var(--black);}
.btn-primary:hover{background:var(--gold2);}
